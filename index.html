<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>To-Do List</h1>
    </header>

    <!-- Form tambah tugas -->
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Tambah tugas baru..." required>
      <button type="submit">Tambah</button>
    </form>
    
    <!-- list item -->
    <ul id="todo-items"></ul>
    
    <footer>
      <p>© 2025 To-Do List App</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
